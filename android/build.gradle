// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// @capgo/capacitor-social-login compiles against androidx.browser 1.9.0 (its
// Apple provider, compileOnly since only Google is enabled) while Google's
// androidbrowserhelper 2.5.0 brings 1.4.0; Gradle's consistent resolution then
// refuses both. One version everywhere: 1.8.0, the newest that still builds
// against compileSdk 35 (1.9.0 needs 36).
allprojects {
    configurations.all {
        resolutionStrategy { force 'androidx.browser:browser:1.8.0' }
    }
}
